{# Full Den entry: image (if any) + rendered body #}
{% if entry.has_media %}
<a href="/den/media?profile={{ entry.profile }}&path={{ entry.file|urlencode }}" target="_blank" rel="noopener">
  <img src="/den/media?profile={{ entry.profile }}&path={{ entry.file|urlencode }}"
       alt="{{ entry.summary }}" loading="lazy"
       style="max-width:100%; max-height:22rem; border-radius:var(--pico-border-radius); margin:0.3rem 0 0.6rem; display:block;">
</a>
<p style="font-size:0.7rem; color:var(--pico-muted-color); margin:0 0 0.6rem; word-break:break-all;">📎 {{ entry.file }}</p>
{% endif %}

{% if entry.body %}
<div style="font-size:0.9rem; line-height:1.55;">{{ entry.body | den_md(wikilinks, active_profile) }}</div>
{% else %}
<p style="font-size:0.85rem; color:var(--pico-muted-color);">(No body — summary only.)</p>
{% endif %}
