<tr id="intrusive-row-{{ t.id }}">
  <td colspan="6">
    <form hx-post="/api/intrusive/{{ t.id }}/edit"
          hx-target="#intrusive-row-{{ t.id }}"
          hx-swap="outerHTML"
          style="display:flex; flex-direction:column; gap:0.6rem; padding:0.4rem 0;">
      <div style="display:flex; gap:0.75rem; align-items:flex-end; flex-wrap:wrap;">
        {% if t.kind == "loose_threads" %}
          <div style="flex:2; min-width:220px;">
            <strong>🧵 Loose Threads</strong>
            <small style="color:var(--pico-muted-color); display:block; font-size:0.75rem;">
              Injects a random item from the Den's <code>THE_THREAD.md</code> — no fixed text.</small>
          </div>
        {% else %}
          <label style="flex:2; min-width:220px; margin:0;">
            Thought
            <input type="text" name="text" value="{{ t.text or '' }}" required
              placeholder="e.g. What if she's getting bored of me?" style="padding:0.35rem 0.5rem;">
          </label>
        {% endif %}
        <label style="margin:0; width:6rem;">
          Weight
          <input type="number" name="weight" value="{{ '%.2f'|format(t.weight) }}" min="0" step="0.1" style="padding:0.3rem 0.4rem;">
        </label>
      </div>
      {% set assoc = t.mood_assoc %}
      {% include "partials/intrusive_mood_picker.html" %}
      <div>
        <button type="submit" style="margin:0; padding:0.3rem 0.9rem; font-size:0.82rem;">Save</button>
        <button type="button" class="secondary outline" style="margin:0 0 0 0.4rem; padding:0.3rem 0.9rem; font-size:0.82rem;"
          hx-get="/api/intrusive/{{ t.id }}/row"
          hx-target="#intrusive-row-{{ t.id }}"
          hx-swap="outerHTML">Cancel</button>
      </div>
    </form>
  </td>
</tr>
